[package]
name = "pomelo"
version = "0.1.0"
description = "Pomelo OS"
edition = "2021"

[lib]
name = "pomelo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "session"] }
tauri-plugin-dialog = "2"
# 芝麻开门: Argon2id (master password → key), XChaCha20-Poly1305 (entries), keychain + Touch ID + pasteboard
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
# 小拾: streaming from the local model (127.0.0.1) and the cloud services; tokio is already in the tree via tauri
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "json"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
